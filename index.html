<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Biodata Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="form-container">
        <h2>Student Biodata Form</h2>
        <p>Fill in your personal information below.</p>

        <form id="biodataForm">

            <label for="name">Full Name:</label>
            <input type="text" id="name" placeholder="Enter your full name">

            <label for="matric">Matric Number:</label>
            <input type="text" id="matric" placeholder="Enter matric number">

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email">

            <label for="phone">Phone Number:</label>
            <input type="text" id="phone" placeholder="Enter phone number">

            <label for="gender">Gender:</label>
            <select id="gender">
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label for="department">Department:</label>
            <input type="text" id="department" placeholder="Enter your department">

            <label for="age">Age:</label>
            <input type="number" id="age" placeholder="Enter your age">

            <button type="submit">Submit</button>

            <p id="message"></p>

        </form>
    </div>

    <script src="script.js"></script>
      


</body>
</html>
